<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静态几何图形预览</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f0f4f8; /* 保持一致的浅灰底色 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 统一控制 SVG 内所有线条的颜色和粗细 */
    #pentagon {
      stroke: black;
      stroke-width: 0.3;
    }
  </style>
</head>
<body>

  <!-- 静态图形容器 -->
  <div id="animation-container">
    <!-- 正五边形 SVG -->
    <svg id="pentagon" width="200" height="200" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
      
      <!-- 1. 外层大正五边形 -->
      <path 
        d="M 0,-80 L 76.08,-24.72 L 47.02,64.72 L -47.02,64.72 L -76.08,-24.72 Z" 
        fill="none" 
        stroke-linejoin="round"
      />

      <!-- 2. 外接圆 (半径 80) -->
      <path 
        d="M 0,-80 
           A 80 80 0 0 1 0,80 
           A 80 80 0 0 1 0,-80" 
        fill="none" 
        stroke-linecap="round"
      />

      <!-- 3. 大五角星 (连接五边形对角线) -->
      <path 
        d="M 0,-80 L 47.02,64.72 L -76.08,-24.72 L 76.08,-24.72 L -47.02,64.72 Z" 
        fill="none" 
        stroke-linejoin="round"
      />

      <!-- 4. 内部小五角星（倒五角星）向外延伸到大五边形的边缘 -->
      <g fill="none" stroke-linecap="round">
        <path d="M 0,9.44 L -64.98,9.44 M 0,9.44 L 64.98,9.44" />
        <path d="M 0,9.44 L -64.98,9.44 M 0,9.44 L 64.98,9.44" transform="rotate(72)" />
        <path d="M 0,9.44 L -64.98,9.44 M 0,9.44 L 64.98,9.44" transform="rotate(144)" />
        <path d="M 0,9.44 L -64.98,9.44 M 0,9.44 L 64.98,9.44" transform="rotate(216)" />
        <path d="M 0,9.44 L -64.98,9.44 M 0,9.44 L 64.98,9.44" transform="rotate(288)" />
      </g>

      <!-- 
        5. 5个小正圆形。
        恢复到它们的初始位置：圆心在内侧小五边形的顶点上。
        即 y 轴方向上距离中心为 -11.67，半径保持 13.05。
      -->
      <g fill="none">
        <circle cx="0" cy="-11.67" r="13.05" />
        <g transform="rotate(72)"><circle cx="0" cy="-11.67" r="13.05" /></g>
        <g transform="rotate(144)"><circle cx="0" cy="-11.67" r="13.05" /></g>
        <g transform="rotate(216)"><circle cx="0" cy="-11.67" r="13.05" /></g>
        <g transform="rotate(288)"><circle cx="0" cy="-11.67" r="13.05" /></g>
      </g>

    </svg>
  </div>

</body>
</html>
