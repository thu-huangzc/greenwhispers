<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏视频交互项目</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 替换为 Canvas，用于绘制 PNG 序列帧 -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- 音频元素 -->
    <audio id="audio-base" src="oenothera_base_s.mp3" loop preload="auto"></audio>
    <audio id="audio-grow" src="oenothera_grow_s.mp3" preload="auto"></audio>
    <audio id="audio-bees" src="oenothera_bees_s.mp3" preload="auto"></audio>
    <audio id="audio-idle" src="oenothera_idle_s.mp3" loop preload="auto"></audio>
    <audio id="audio-hold" src="oenothera_hold_s.mp3" preload="auto"></audio>
    <audio id="audio-bugflyin" src="oenothera_bugflyin_s.mp3" preload="auto"></audio>
    <audio id="audio-hint" src="icon_notification.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
