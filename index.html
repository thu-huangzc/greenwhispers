<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG 转换动画预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f0f4f8;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (hover: hover) and (pointer: fine) {
      body.use-custom-cursor,
      body.use-custom-cursor * {
        cursor: none !important;
      }
    }

    .icon-container {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .icon-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }
    .svg-wrapper {
      position: absolute;
      width: 80px;
      height: 80px;
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform-origin: center;
    }
    
    /* 初始状态：显示 sun_1，隐藏 sun_2 */
    .svg-sun1 {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }
    .svg-sun2 {
      opacity: 0;
      transform: rotate(-90deg) scale(0.5);
    }

    /* 切换状态：隐藏 sun_1，显示 sun_2 */
    .icon-container.active .svg-sun1 {
      opacity: 0;
      transform: rotate(90deg) scale(0.5);
    }
    .icon-container.active .svg-sun2 {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    /* -------------------------------------
       新增：sun_1 线条（微笑/闭眼）手写修剪动画
       ------------------------------------- */
    /* 我们给 sun_1 的 .cls-3 （黑色描边线条）添加手写效果 */
    .svg-sun1 .cls-3 {
      /* 这里的长度可以根据实际 path 长度微调，通常设为一个足够大的值 */
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 当切换到 active (隐藏 sun_1) 时，把线条"擦除"回去 */
    .icon-container.active .svg-sun1 .cls-3 {
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.4s ease;
    }
    
    /* -------------------------------------
       新增：sun_2 白色线条（光芒）迸发动画 
       ------------------------------------- */
    /* 真正的 sun_2 光芒样式 */
    .svg-sun2 .sun2-cls-2 {
      transform-origin: 61.33px 60.05px; /* 以整个SVG中心点为原点，实现从中间迸发 */
      transform: scale(0);
      opacity: 0;
      fill: #fff; /* 默认白色 */
      /* 增加 fill 和 filter 的恢复过渡，保证 hover 移走时能平滑变回白色 */
      transition: transform 0.6s cubic-bezier(0.34, 1.8, 0.64, 1), opacity 0.3s ease, fill 0.3s ease, filter 0.3s ease;
    }
    
    /* 同样处理 sun_2 中的描边元素（如果有的话），用于发光 */
    .svg-sun2 .sun2-cls-1 {
      stroke: #fff; /* 默认白色描边 */
      /* 增加 stroke 和 filter 的恢复过渡 */
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* 当 icon-container 处于 active 状态（显示 sun_2 时），触发线条迸发 */
    /* 这里非常关键：必须使用正确的选择器 .sun2-cls-2 */
    #sun-toggle.active .svg-sun2 .sun2-cls-2 {
      transform: scale(1);
      opacity: 1;
    }

    /* 为每一条光芒添加有规律的延迟，使其呈顺时针或规律性依次展开（线性递增 0.05s） */
    /* 这里改用 nth-child 并且指定父级，确保精确命中每一根光芒 */
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(2) { transition-delay: 0.05s; }
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(3) { transition-delay: 0.10s; }
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(4) { transition-delay: 0.15s; }
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(5) { transition-delay: 0.20s; }
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(6) { transition-delay: 0.25s; }
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(7) { transition-delay: 0.30s; }
    #sun-toggle .svg-sun2 path.sun2-cls-2:nth-child(8) { transition-delay: 0.35s; }

    /* -------------------------------------
       新增：金黄色发光阶段 (glow 状态)
       ------------------------------------- */
    /* 当容器添加了 glowing 类时，内部线条和描边变成更有质感的暖阳黄并带有发光效果 */
    #sun-toggle.glowing .svg-sun2 .sun2-cls-2 {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      /* 进入金色状态可以稍微快一点，同时保留原本的形变和透明度动画 */
      transition: transform 0.6s cubic-bezier(0.34, 1.8, 0.64, 1), opacity 0.3s ease, fill 0.3s ease, filter 0.3s ease;
    }
    #sun-toggle.glowing .svg-sun2 .sun2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* 当 icon-container 处于 active 状态（显示 sun_2 时），触发线条迸发 */
    .icon-container.active .svg-sun2 .sun2-cls-2 {
      transform: scale(1);
      opacity: 1;
    }

    /* -------------------------------------
       新增：独立 sun 图标的收集悬停交互
       ------------------------------------- */
    .icon-container.collectable {
      cursor: pointer;
    }
    
    /* 仅仅放大内部的 svg 容器，而不是整个大容器，这样挂载在大容器上的文字就不会跟着变大了 */
    .icon-container.collectable .svg-wrapper {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .icon-container.collectable:hover .svg-wrapper {
      /* 鼠标悬停时放大 SVG，自带 cubic-bezier 回弹 */
      transform: scale(1.2);
    }

    /* 悬停放大时，同时触发黄色的发光效果，复用 glowing 状态的样式 */
    .icon-container.collectable:hover .svg-sun2 .sun2-cls-2 {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.collectable:hover .svg-sun2 .sun2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }
    
    /* Touch 悬停放大时，同时触发黄色的发光效果 */
    .icon-container.collectable:hover .svg-touch2 .touch2-curve {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.collectable:hover .svg-touch2 .touch2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* Taste 悬停放大时，同时触发黄色的发光效果 */
    .icon-container.collectable:hover .svg-taste2 .taste2-curve {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.collectable:hover .svg-taste2 .taste2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    .hint {
      position: absolute;
      bottom: -40px;
      font-size: 14px;
      color: #666;
      white-space: nowrap;
    }

    /* -------------------------------------
       新增：彩虹渐变过渡层的通用样式 
       ------------------------------------- */
    .rainbow-fill {
      opacity: 0;
      /* 增加淡出淡入的时间，使用极其平滑的曲线，让颜色的消散像烟雾一样 */
      transition: opacity 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    /* -------------------------------------
       新增：sound 图标特定样式和动画
       ------------------------------------- */
    /* sound_1 中间的白色线条(.cls-1)和黑色波纹线条(.cls-3)：在切换时同步进行纵向拉伸形变 */
    .svg-sound1 .cls-1,
    .svg-sound1 .cls-3 {
      /* 设置形变中心点，使得拉伸从中心向上下展开 */
      transform-origin: center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    
    .icon-container.active .svg-sound1 .cls-1,
    .icon-container.active .svg-sound1 .cls-3 {
      /* 切换到 sound_2 时，把 sound_1 的白线和黑线同步纵向拉伸，限制形变比例不超过 sound_2 的对应线条长度 */
      transform: scaleY(1.6);
      opacity: 0;
    }

    /* 为了让不同线条拉伸有一点点层次感，可以给它们加上微小的延迟 */
    .svg-sound1 g:nth-of-type(1) .cls-1, .svg-sound1 g:nth-of-type(1) .cls-3 { transition-delay: 0.0s; }
    .svg-sound1 g:nth-of-type(2) .cls-1, .svg-sound1 g:nth-of-type(2) .cls-3 { transition-delay: 0.05s; }
    .svg-sound1 g:nth-of-type(3) .cls-1, .svg-sound1 g:nth-of-type(3) .cls-3 { transition-delay: 0.10s; }
    .svg-sound1 g:nth-of-type(4) .cls-1, .svg-sound1 g:nth-of-type(4) .cls-3 { transition-delay: 0.15s; }
    .svg-sound1 g:nth-of-type(5) .cls-1, .svg-sound1 g:nth-of-type(5) .cls-3 { transition-delay: 0.20s; }

    /* sound_2 白色音波绽放动画：从纵向被压扁的状态拉伸回弹出来 */
    .svg-sound2 .sound2-cls-2 {
      transform-origin: center;
      /* 初始状态：高度被压缩到很小，配合透明度 */
      transform: scaleY(0.2);
      opacity: 0;
      fill: #fff;
      /* 这里使用更强烈的回弹曲线，表现出纵向拉伸的弹性 */
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .svg-sound2 .sound2-cls-1 {
      stroke: #fff;
      transition: stroke 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    
    .icon-container.active .svg-sound2 .sound2-cls-2 {
      /* 恢复原始比例，伴随回弹 */
      transform: scaleY(1);
      opacity: 1;
    }

    /* sound_2 波纹依次展开的延迟 */
    #sound-toggle .svg-sound2 path.sound2-cls-2:nth-of-type(1) { transition-delay: 0.05s; }
    #sound-toggle .svg-sound2 path.sound2-cls-2:nth-of-type(2) { transition-delay: 0.10s; }
    #sound-toggle .svg-sound2 path.sound2-cls-2:nth-of-type(3) { transition-delay: 0.15s; }
    #sound-toggle .svg-sound2 path.sound2-cls-2:nth-of-type(4) { transition-delay: 0.20s; }
    #sound-toggle .svg-sound2 path.sound2-cls-2:nth-of-type(5) { transition-delay: 0.25s; }

    /* 金黄色发光阶段复用 glowing 类 */
    .icon-container.glowing .svg-sound2 .sound2-cls-2 {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: transform 0.6s cubic-bezier(0.2, 3, 0.64, 1), opacity 0.3s ease, fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.glowing .svg-sound2 .sound2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* -------------------------------------
       新增：touch 图标特定样式和动画
       ------------------------------------- */
    .svg-touch1 .touch1-curve {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    
    .icon-container.active .svg-touch1 .touch1-curve {
      /* 切换到 touch_2 时，将 touch_1 的曲率变平（通过在 Y 轴上压扁来实现） */
      transform: scaleY(0.2);
      opacity: 0;
    }

    .svg-touch2 .touch2-curve {
      transform-box: fill-box;
      transform-origin: center;
      /* 初始状态：被极度压扁成几乎完全的平线 */
      transform: scaleY(0.01);
      opacity: 0;
      fill: #fff;
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .svg-touch2 .touch2-cls-1 {
      stroke: #fff;
      transition: stroke 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .icon-container.active .svg-touch2 .touch2-curve {
      /* 恢复原始比例，伴随回弹（从平到曲） */
      transform: scaleY(1);
      opacity: 1;
    }

    /* touch_2 两根线条稍微加一点延迟错落感 */
    #touch-toggle .svg-touch2 path.touch2-curve:nth-of-type(1) { transition-delay: 0.05s; }
    #touch-toggle .svg-touch2 path.touch2-curve:nth-of-type(2) { transition-delay: 0.15s; }

    .icon-container.glowing .svg-touch2 .touch2-curve {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.glowing .svg-touch2 .touch2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* -------------------------------------
       新增：smell 图标特定样式和动画
       ------------------------------------- */
    .svg-smell1 .smell1-curve {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    
    .icon-container.active .svg-smell1 .smell1-curve {
      /* 切换到 smell_2 时，将 smell_1 的曲率变平 */
      transform: scaleY(0.2);
      opacity: 0;
    }

    .svg-smell2 .smell2-curve {
      transform-box: fill-box;
      transform-origin: center;
      /* 初始状态：被极度压扁成几乎完全的平线 */
      transform: scaleY(0.01);
      opacity: 0;
      fill: #fff;
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .svg-smell2 .smell2-cls-1 {
      stroke: #fff;
      transition: stroke 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .icon-container.active .svg-smell2 .smell2-curve {
      /* 恢复原始比例，伴随强力回弹（从平到曲） */
      transform: scaleY(1);
      opacity: 1;
    }

    /* smell_2 三根线条稍微加一点延迟错落感，让气味飘散更有层次 */
    #smell-toggle .svg-smell2 path.smell2-curve:nth-of-type(1) { transition-delay: 0.05s; }
    #smell-toggle .svg-smell2 path.smell2-curve:nth-of-type(2) { transition-delay: 0.10s; }
    #smell-toggle .svg-smell2 path.smell2-curve:nth-of-type(3) { transition-delay: 0.15s; }

    .icon-container.glowing .svg-smell2 .smell2-curve {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.glowing .svg-smell2 .smell2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* -------------------------------------
       新增：taste 图标特定样式和动画
       ------------------------------------- */
    /* 添加 wrapper 层级的显隐切换和旋转逻辑 */
    .icon-container.active .svg-taste1 {
      opacity: 0;
      transform: scale(0.5) rotate(90deg);
      pointer-events: none;
    }
    
    .svg-taste2 {
      opacity: 0;
      transform: scale(0.5) rotate(-90deg);
      pointer-events: none;
    }
    .icon-container.active .svg-taste2 {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      pointer-events: auto;
    }

    .svg-taste1 .taste1-curve {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    
    .icon-container.active .svg-taste1 .taste1-curve {
      /* 切换到 taste_2 时，将 taste_1 的线条压扁 */
      transform: scaleY(0.2);
      opacity: 0;
    }

    .svg-taste2 .taste2-curve {
      transform-box: fill-box;
      transform-origin: center;
      /* 初始状态：被极度压扁成几乎完全的平线 */
      transform: scaleY(0.01);
      opacity: 0;
      fill: #fff;
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .svg-taste2 .taste2-cls-1 {
      stroke: #fff;
      transition: stroke 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .icon-container.active .svg-taste2 .taste2-curve {
      /* 恢复原始比例，伴随强力回弹 */
      transform: scaleY(1);
      opacity: 1;
    }

    /* taste_2 多个点稍微加一点随机延迟错落感 */
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(1) { transition-delay: 0.02s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(2) { transition-delay: 0.08s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(3) { transition-delay: 0.14s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(4) { transition-delay: 0.05s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(5) { transition-delay: 0.11s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(6) { transition-delay: 0.17s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(7) { transition-delay: 0.20s; }
    #taste-toggle .svg-taste2 path.taste2-curve:nth-of-type(8) { transition-delay: 0.09s; }

    .icon-container.glowing .svg-taste2 .taste2-curve {
      fill: #f9d77e; 
      filter: drop-shadow(0 0 6px rgba(249, 215, 126, 0.8));
      transition: transform 0.6s cubic-bezier(0.34, 2.2, 0.64, 1), opacity 0.3s ease, fill 0.3s ease, filter 0.3s ease;
    }
    .icon-container.glowing .svg-taste2 .taste2-cls-1 {
      stroke: #f9d77e; 
      filter: drop-shadow(0 0 8px rgba(249, 215, 126, 0.9));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }

    /* -------------------------------------
       新增：平滑过渡的自定义DOM光标
       ------------------------------------- */
    .custom-cursor {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 9999999; /* 确保高于 loading-page 的 999999 */
      /* 给 transform 添加平滑过渡，仅对缩放生效 */
      transition: transform 0.15s ease-out, width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      /* 初始状态通过 translate 将光标中心点对齐实际鼠标位置 (相当于原本的 16 16 热点) */
      transform: translate(-50%, -50%) scale(1);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .custom-cursor.clicked {
      transform: translate(-50%, -50%) scale(0.75);
    }
    .custom-cursor.ready {
      width: 90px;
      height: 90px;
    }
    .custom-cursor .cursor-img {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    /* 自定义文字组容器 */
    .custom-cursor .cursor-text-group {
      position: absolute;
      top: 50%; 
      left: 50%;
      /* 初始状态：透明且缩小为0 */
      transform: translate(-50%, -50%) scale(0);
      transform-origin: center;
      
      display: flex;
      flex-direction: column;
      align-items: center; /* 默认居中对齐 */
      
      z-index: 1;
      font-family: "PingFang TC", "PingFang HK", "PingFang SC", -apple-system, "Microsoft JhengHei", "Heiti TC", sans-serif;
      color: #333;
      opacity: 0;
      /* 动画过渡时间和缓动函数 */
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      white-space: nowrap;
    }

    .custom-cursor.ready .cursor-text-group {
      /* 放大后的状态：完全不透明且正常大小 */
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    
    /* --- 细化文字样式 --- */
    :root {
      --base-font-size: 18px; 
    }

    .text-row-top {
      display: flex;
      justify-content: space-between;
      width: 91%; /* 与主文字等宽，以便实现左对齐和右对齐 */
      margin-bottom: 2px; /* 与主文字的间距 */
      align-items: flex-end; /* 底部对齐 */
    }

    .text-click-cn {
      font-size: calc(var(--base-font-size) * 7 / 18); /* 7px */
      font-weight: 800;
    }

    .text-click-en {
      font-size: calc(var(--base-font-size) * 4 / 9); /* 8px */
      font-weight: 800;
    }

    .text-main {
      font-size: var(--base-font-size); /* 18px */
      font-weight: 500; /* medium */
      line-height: 1;
    }

    .text-sow {
      font-size: calc(var(--base-font-size) * 2 / 3); /* 12px */
      font-weight: 500; /* medium */
      margin-top: -1.5px; /* 与主文字的间距 */
    }

    /* -------------------------------------
       新增：进入热区时的反色态
       （图形：白底黑边 → 黑底白边；文字：#333 → #fff）
       ------------------------------------- */
    .custom-cursor .cursor-img path[fill="#fff"] {
      transition: fill 0.25s ease;
    }
    .custom-cursor .cursor-img path[stroke="#000"] {
      transition: stroke 0.25s ease;
    }
    .custom-cursor .cursor-text-group {
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease;
    }
    .custom-cursor.inverted .cursor-img path[fill="#fff"] {
      fill: #000;
    }
    .custom-cursor.inverted .cursor-img path[stroke="#000"] {
      stroke: #fff;
    }
    .custom-cursor.inverted .cursor-text-group {
      color: #fff;
    }

    /* -------------------------------------
       新增：鼠标点击光标动效
       ------------------------------------- */
    .cursor-click-effect {
      position: fixed;
      pointer-events: none;
      border: 2px solid rgba(161, 140, 209, 0.8); /* 配合极光渐变的主色调 */
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: click-ripple 0.5s ease-out forwards;
      z-index: 9999998; /* 确保高于 loading-page */
    }

    @keyframes click-ripple {
      0% {
        width: 0px;
        height: 0px;
        opacity: 1;
        border-width: 3px;
      }
      100% {
        width: 50px;
        height: 50px;
        opacity: 0;
        border-width: 1px;
      }
    }

    /* -------------------------------------
       新增：待场视频 (Attract Video) 样式
       ------------------------------------- */
    #attract-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      background-color: #000;
      z-index: 2147483646; /* 几乎位于最顶层，仅低于 #global-fade-overlay */
      pointer-events: auto;
      cursor: none;
      transition: opacity 0.8s ease;
      opacity: 1;
    }
    #attract-video.hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* 待场视频处于显示阶段时，禁止下方所有内容响应交互（避免误触主程序） */
    body.attract-active #loading-page,
    body.attract-active .icon-container,
    body.attract-active #custom-cursor {
      pointer-events: none;
    }
    body.attract-active #custom-cursor {
      opacity: 0;
    }

    /* -------------------------------------
       新增：加载页面动效
       ------------------------------------- */
    #loading-page {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #f0f4f8;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .loader-container {
      --uib-size: 240px; /* <--- 统一在这里修改点之间的距离，减小数值（如 100px）则距离变近，增大数值（如 200px）则距离变远 */
      --uib-color: #ffffff; /* 内部填充为白色 */
      --uib-speed: 5s; /* 将速度从 2.5s 减慢到 4s */
      --uib-dot-size: 35px; /* 固定点的绝对大小为 35px，不再随容器宽度变化，避免调整距离时点跟着变大变小 */
      --uib-border-width: 0.75px; /* <--- 统一在这里修改黑色描边的大小，目前设为 0.75px */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: var(--uib-size);
      height: var(--uib-dot-size);
    }

    .loader-dot {
      position: absolute;
      top: calc(50% - var(--uib-dot-size) / 2);
      left: calc(0px - var(--uib-dot-size) / 2);
      display: block;
      height: var(--uib-dot-size);
      width: var(--uib-dot-size);
      border-radius: 50%;
      background-color: transparent; /* 父容器透明，由伪元素或img来展示 */
      animation: stream var(--uib-speed) linear infinite both;
    }

    .loader-dot::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      background-color: var(--uib-color);
      border: var(--uib-border-width) solid #353535; /* 使用变量控制描边粗细 */
      box-sizing: border-box; /* 确保描边包含在元素尺寸内 */
      animation: stream-dot var(--uib-speed) linear infinite both;
      z-index: 1;
    }

    .loader-dot img {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%) scale(1);
      object-fit: contain;
      animation: stream-img var(--uib-speed) linear infinite both;
      z-index: 2;
    }

    /* 继承相同的延迟 */
    .loader-dot:nth-child(1),
    .loader-dot:nth-child(1)::before,
    .loader-dot:nth-child(1) img {
      animation-delay: calc(var(--uib-speed) * -0.8);
    }

    .loader-dot:nth-child(2),
    .loader-dot:nth-child(2)::before,
    .loader-dot:nth-child(2) img {
      animation-delay: calc(var(--uib-speed) * -0.6);
    }

    .loader-dot:nth-child(3),
    .loader-dot:nth-child(3)::before,
    .loader-dot:nth-child(3) img {
      animation-delay: calc(var(--uib-speed) * -0.4);
    }

    .loader-dot:nth-child(4),
    .loader-dot:nth-child(4)::before,
    .loader-dot:nth-child(4) img {
      animation-delay: calc(var(--uib-speed) * -0.2);
    }

    .loader-dot:nth-child(5),
    .loader-dot:nth-child(5)::before,
    .loader-dot:nth-child(5) img {
      animation-delay: 0s;
    }

    @keyframes stream {
      0%,
      100% {
        transform: translateX(0) scale(0);
      }

      50% {
        transform: translateX(calc(var(--uib-size) * 0.5)) scale(1.5); /* 增加点在中间的放大倍数，让它们显得更紧凑 */
      }

      99.999% {
        transform: translateX(calc(var(--uib-size))) scale(0);
      }
    }

    /* 控制黑点的透明度渐变消失 */
    @keyframes stream-dot {
      0%, 100% { opacity: 1; }
      20%, 80% { opacity: 1; }
      40%, 60% { opacity: 0; }
      50% { opacity: 0; }
    }

    /* -------------------------------------
       新增：加载页面展开后的动画样式
       ------------------------------------- */
    #loading-page.expand {
      /* 保持背景颜色不变，不要变透明，防止透出底下的内容（即使 display:none 也保险起见保持背景） */
      background-color: #f0f4f8;
    }
    
    #loading-page.expand .loader-dot {
      /* 停止原有循环动画，进入静态并列状态 */
      animation: none !important;
      position: relative; /* 改回 relative 让 flex 生效 */
      top: auto;
      left: auto;
      margin: 0 40px; /* 控制并列展开后的间距 */
      /* 增加一点过渡效果，让点从中间散开（可选，因为animation突然停掉会有跳跃感） */
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #loading-page.expand .loader-dot::before {
      animation: none !important;
      opacity: 0; /* 展开后隐藏黑点，只展示 SVG */
      transition: opacity 0.5s ease;
    }

    #loading-page.expand .loader-dot img {
      animation: none !important;
      opacity: 1; /* 始终显示图标 */
      transform: translate(-50%, -50%) scale(2); /* 展开后图标放大，因为去掉了外层容器大小限制，调整比例 */
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #loading-page.expand .loader-container {
      /* 修改容器样式以适应水平排列 */
      width: auto;
      justify-content: center;
      /* 这里可以让整个容器再放大一些，适应最终展示效果 */
      transform: scale(1.0);
      transition: transform 0.8s ease;
    }
    /* -------------------------------------
       新增：加载页面汇聚后的动画样式 (collapse)
       ------------------------------------- */
    #loading-page.collapse .loader-dot {
      /* 将 margin 收缩回 0，使它们汇聚到中心 */
      margin: 0 0 !important;
      transition: margin 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    }

    #loading-page.collapse .loader-dot img {
      /* 图标缩小并消失 */
      transform: translate(-50%, -50%) scale(0) !important;
      opacity: 0 !important;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #loading-page.collapse .loader-dot::before {
      /* 用上传的 seed.png 替换椭圆形黑点 */
      opacity: 1 !important;
      background: center/contain no-repeat url('images/ui/seed.png');
      background-color: transparent;
      border: none;
      border-radius: 0;
      transform: scale(0.38) rotate(630deg);
      transform-origin: 50% 50%;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 只有最中间的一个点（第3个）显示为最终的椭圆，其他的隐藏掉，避免叠加变黑 */
    #loading-page.collapse .loader-dot:not(:nth-child(3))::before {
      opacity: 0 !important;
    }

    /* -------------------------------------
       新增：seed 下落元素与阴影
       ------------------------------------- */
    #seed-fall {
      position: fixed;
      width: 14px;
      height: 14px;
      background: center/contain no-repeat url('images/ui/seed.png');
      transform-origin: 50% 50%;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
      z-index: 1000000;
      pointer-events: none;
    }
    #seed-shadow {
      position: fixed;
      width: 13px;
      height: 2.5px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0) 90%);
      filter: blur(2px);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.6);
      z-index: 999999;
      pointer-events: none;
      border-radius: 50%;
    }
    /* 下落开始时，隐藏中心点上的伪元素，避免与独立 seed 重叠 */
    #loading-page.fall .loader-dot::before {
      opacity: 0 !important;
      transition: opacity 0.05s ease;
    }
    /* -------------------------------------
       新增：几何阵法 (magic-array) 绘制动画
       ------------------------------------- */
    #magic-array {
      animation: rotateAll 4s ease-in-out forwards;
    }

    @keyframes rotateAll {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .draw-pentagon {
      stroke-dasharray: 471;
      stroke-dashoffset: 471;
      animation: drawLine 1s cubic-bezier(0.85, 0, 0.15, 1) forwards;
    }

    .draw-circle {
      stroke-dasharray: 503;
      stroke-dashoffset: 503;
      animation: drawLine 1s cubic-bezier(0.85, 0, 0.15, 1) 1s forwards;
    }

    .draw-star {
      stroke-dasharray: 761;
      stroke-dashoffset: 761;
      animation: drawLine 1s cubic-bezier(0.85, 0, 0.15, 1) 2s forwards;
    }

    .draw-inner-lines {
      stroke-dasharray: 0 125;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: drawCenterOut 1s cubic-bezier(0.85, 0, 0.15, 1) 2s forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawCenterOut {
      0% { opacity: 1; stroke-dasharray: 0 125; }
      100% { opacity: 1; stroke-dasharray: 125 0; }
    }

    .draw-small-circles {
      opacity: 0;
      animation: drawCircleAnim 1s cubic-bezier(0.85, 0, 0.15, 1) 3s forwards;
    }

    /* 必须让子元素继承或也执行动画，才能画出圆 */
    .draw-small-circles circle {
      animation: drawCircleAnim 1s cubic-bezier(0.85, 0, 0.15, 1) 3s forwards;
    }

    @keyframes drawCircleAnim {
      0% { opacity: 1; stroke-dashoffset: 82; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }

    /* 新增：sun_2 悬停时的微弱呼吸动画 */
    @keyframes sunBreathing {
      0% { transform: translate(0px, -23.34px) scale(0.6525); }
      50% { transform: translate(0px, -23.34px) scale(0.68); }
      100% { transform: translate(0px, -23.34px) scale(0.6525); }
    }
    /* -------------------------------------
       新增：含羞草 (Mimosa) 交互界面样式
       ------------------------------------- */
    #mimosa-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f0f4f8; /* 修改为向日葵容器的浅灰色 */
      z-index: 2000000; /* 盖住向日葵所有内容 */
      display: none; /* 初始隐藏 */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    /* -------------------------------------
       新增：Touch 图标相关的类 (完全复用 sun 的动画效果结构)
       ------------------------------------- */
    .touch1-cls-1 {
      fill: none;
      stroke: #666;
      stroke-miterlimit: 10;
      stroke-width: 0.5px;
    }
    .touch1-cls-2 {
      fill: #666;
    }

    .touch2-cls-1 {
      fill: none;
      stroke: #fff;
      stroke-miterlimit: 10;
      stroke-width: 0.5px;
    }
    .touch2-cls-2 {
      fill: #fff;
    }

    /* SVG 容器，复用 autoSunContainer 的逻辑 */
    #autoTouchContainer {
        width: 80px;
        height: 80px;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3000008; /* 比 mimosa 容器还高 */
        margin: 0;
        cursor: pointer;
        display: none; /* 初始隐藏 */
    }

    /* 虹光层 */
    .touch-rainbow-fill {
      fill: url(#flow-rainbow);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <!-- 全流程结束渐隐黑幕：默认透明且不拦截事件，结束时通过 JS 设为不透明实现淡出 -->
  <div id="global-fade-overlay" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2147483647;transition:opacity 1500ms ease;"></div>
  <!-- 添加音频元素 -->
  <audio id="audio-base" src="sunflower-assets/sunflower_base_s.mp3" loop preload="metadata"></audio>

      <canvas id="oenothera-bg-canvas" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;"></canvas>
      <audio id="oenothera-audio-base" src="video-oenothera/oenothera_base_s.mp3" loop preload="metadata"></audio>
      <audio id="oenothera-audio-grow" src="video-oenothera/oenothera_grow_s.mp3" preload="metadata"></audio>
      <audio id="oenothera-audio-bees" src="video-oenothera/oenothera_bees_s.mp3" preload="metadata"></audio>
      <audio id="oenothera-audio-idle" src="video-oenothera/oenothera_idle_s.mp3" loop preload="metadata"></audio>
      <audio id="oenothera-audio-hold" src="video-oenothera/oenothera_hold_s.mp3" preload="metadata"></audio>

  <!-- dodder 容器 (初始隐藏) -->
  <div id="dodder-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 3000000; background-color: #f0f4f8; overflow: hidden; cursor: pointer;">
      <canvas id="dodder-bg-canvas" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;"></canvas>
      <audio id="dodder-audio-base" src="video-dodder/dodder_base_s.mp3" loop preload="metadata"></audio>
      <audio id="dodder-audio-grow" src="video-dodder/dodder_grow_s.mp3" preload="metadata"></audio>
      <audio id="dodder-audio-hold" src="video-dodder/dodder_hold_s.mp3" preload="metadata"></audio>

      // ================= 音频淡入淡出工具函数 (使用 requestAnimationFrame，避免 setInterval 在主线程造成的 GC 抖动) =================
      // 严格 clamp 一下，避免浮点累积导致 volume 越界（HTMLMediaElement.volume 必须在 [0, 1]）
      function __clampVol(v) {
          if (v < 0) return 0;
          if (v > 1) return 1;
          return v;
      }
      function fadeOutAudio(audio, duration = 1000) {
          if (!audio) return;
          const originalVolume = __clampVol(audio.volume);
          if (audio.__fadeRaf) cancelAnimationFrame(audio.__fadeRaf);
          const startTs = performance.now();
          const startVol = originalVolume;
          const step = (now) => {
              let t = (now - startTs) / duration;
              if (t < 0) t = 0;
              if (t > 1) t = 1;
              audio.volume = __clampVol(startVol * (1 - t));
              if (t < 1) {
                  audio.__fadeRaf = requestAnimationFrame(step);
              } else {
                  audio.volume = 0;
                  audio.pause();
                  audio.currentTime = 0;
                  audio.volume = __clampVol(originalVolume); // 重置音量以便下次播放
                  audio.__fadeRaf = null;
              }
          };
          audio.__fadeRaf = requestAnimationFrame(step);
      }

      function fadeInAudio(audio, targetVolume = 1, duration = 1000) {
          if (!audio) return;
          if (audio.__fadeRaf) cancelAnimationFrame(audio.__fadeRaf);
          const tgt = __clampVol(targetVolume);
          audio.volume = 0;
          audio.play().catch(e => console.log('Audio play prevented:', e));
          const startTs = performance.now();
          const step = (now) => {
              let t = (now - startTs) / duration;
              if (t < 0) t = 0;
              if (t > 1) t = 1;
              audio.volume = __clampVol(tgt * t);
              if (t < 1) {
                  audio.__fadeRaf = requestAnimationFrame(step);
              } else {
                  audio.volume = tgt;
                  audio.__fadeRaf = null;
              }
          };
          audio.__fadeRaf = requestAnimationFrame(step);
      }

      const LOADER_ICON_STROKE_WIDTH = '2px'; // <--- 在这里调节 sun/sound/touch/smell/taste 这 5 个图标的黑色描边粗细
      function thickenLoaderIconStroke(dataUrl, newWidth) {
        try {
          const prefix = 'data:image/svg+xml;base64,';
          if (!dataUrl || dataUrl.indexOf(prefix) !== 0) return dataUrl;
          const svgText = atob(dataUrl.slice(prefix.length));
          // 这 5 个 SVG 内部用 .cls-2 表示黑色外描边: "stroke:#000; stroke-width: .5px;"
          // 通过正则把 .cls-2 块里的 stroke-width 替换为新的值。
          const replaced = svgText.replace(
            /(\.cls-2\s*\{[^}]*?stroke-width\s*:\s*)([^;]+)(;)/,
            (m, p1, p2, p3) => p1 + newWidth + p3
          );
          return prefix + btoa(replaced);
        } catch (e) {
          return dataUrl;
        }

      (function setupAttractVideo() {
        const attractVideo = document.getElementById('attract-video');
        if (!attractVideo) return;

        // 进入待场态：禁用主程序交互
        document.body.classList.add('attract-active');

        // 自动播放兜底（部分浏览器需要静音才允许 autoplay）
        attractVideo.muted = true;
        const tryPlay = () => {
          const p = attractVideo.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        };
        tryPlay();

        // 鼠标晃动检测：累计移动距离超过阈值才认为是"晃动"，避免轻微抖动
        const SHAKE_DISTANCE_THRESHOLD = 80; // 像素
        let shakeAccumulated = 0;
        let lastX = null, lastY = null;
        let entered = false;

        function enterMainProgram() {
          if (entered) return;
          entered = true;
          attractVideo.classList.add('hidden');
          document.body.classList.remove('attract-active');
          // 等淡出动画结束后移除 video（保留也可，但移除可释放资源）
          setTimeout(() => {
            try { attractVideo.pause(); } catch (e) {}
            // 不移除节点，仅彻底隐藏，避免影响后续 reload 时的展示
            attractVideo.style.display = 'none';
          }, 900);
          cleanupListeners();
        }

        function onPointerMove(e) {
          const x = e.clientX, y = e.clientY;
          if (lastX !== null && lastY !== null) {
            const dx = x - lastX, dy = y - lastY;
            shakeAccumulated += Math.sqrt(dx * dx + dy * dy);
            if (shakeAccumulated >= SHAKE_DISTANCE_THRESHOLD) {
              enterMainProgram();
            }
          }
          lastX = x; lastY = y;
        }

        function onTouchMove(e) {
          if (!e.touches || e.touches.length === 0) return;
          const t = e.touches[0];
          if (lastX !== null && lastY !== null) {
            const dx = t.clientX - lastX, dy = t.clientY - lastY;
            shakeAccumulated += Math.sqrt(dx * dx + dy * dy);
            if (shakeAccumulated >= SHAKE_DISTANCE_THRESHOLD) {
              enterMainProgram();
            }
          }
          lastX = t.clientX; lastY = t.clientY;
        }

        // 用户主动点击/按键也直接进入
        function onForceEnter() { enterMainProgram(); }

        function cleanupListeners() {
          window.removeEventListener('pointermove', onPointerMove, true);
          window.removeEventListener('mousemove', onPointerMove, true);
          window.removeEventListener('touchmove', onTouchMove, true);
          window.removeEventListener('pointerdown', onForceEnter, true);
          window.removeEventListener('mousedown', onForceEnter, true);
          window.removeEventListener('keydown', onForceEnter, true);
          window.removeEventListener('touchstart', onForceEnter, true);
        }

        window.addEventListener('pointermove', onPointerMove, { passive: true, capture: true });
        window.addEventListener('mousemove', onPointerMove, { passive: true, capture: true });
        window.addEventListener('touchmove', onTouchMove, { passive: true, capture: true });
        window.addEventListener('pointerdown', onForceEnter, { passive: true, capture: true });
        window.addEventListener('mousedown', onForceEnter, { passive: true, capture: true });
        window.addEventListener('keydown', onForceEnter, { passive: true, capture: true });
        window.addEventListener('touchstart', onForceEnter, { passive: true, capture: true });
      })();

      // -------------------------------------------------------------
      (function setupCollectableCursorHover() {
        const cursorEl = document.getElementById('custom-cursor');
        if (!cursorEl) return;

        // 保存进入热区前光标的「文字」与状态，以便离开时还原
        const snapshot = {
          topCn: '', topEn: '', mainText: '', bottomText: '',
          hadReady: false, hadInverted: false,
          captured: false,
        };

        function readCursorTexts() {
          const cnEl = cursorEl.querySelector('#cursor-text-top-cn');
          const enEl = cursorEl.querySelector('#cursor-text-top-en');
          const mainEl = cursorEl.querySelector('#cursor-text-main');
          const bottomEl = cursorEl.querySelector('#cursor-text-bottom');
          return {
            topCn: cnEl ? cnEl.innerText : '',
            topEn: enEl ? enEl.innerText : '',
            mainText: mainEl ? mainEl.innerText : '',
            bottomText: bottomEl ? bottomEl.innerText : '',
          };
        }

        function writeCursorTexts({ topCn, topEn, mainText, bottomText }) {
          const cnEl = cursorEl.querySelector('#cursor-text-top-cn');
          const enEl = cursorEl.querySelector('#cursor-text-top-en');
          const mainEl = cursorEl.querySelector('#cursor-text-main');
          const bottomEl = cursorEl.querySelector('#cursor-text-bottom');
          const topRow = cursorEl.querySelector('.text-row-top');
          if (cnEl) cnEl.innerText = topCn;
          if (enEl) enEl.innerText = topEn;
          if (mainEl) mainEl.innerText = mainText;
          if (bottomEl) bottomEl.innerText = bottomText;
          if (topRow) topRow.style.display = (topCn || topEn) ? 'flex' : 'none';
        }

        document.addEventListener('pointerover', (e) => {
          const target = e.target instanceof Element
            ? e.target.closest('.icon-container.collectable')
            : null;
          if (!target) return;
          // 带 no-cursor-hover-effect 的容器（如 sunflower 的 sun 收集）跳过：保持光标原样
          if (target.classList.contains('no-cursor-hover-effect')) return;
          // 已经是这个热区状态了就不要重复抓取，避免覆盖快照
          if (snapshot.captured) return;

          const cur = readCursorTexts();
          snapshot.topCn = cur.topCn;
          snapshot.topEn = cur.topEn;
          snapshot.mainText = cur.mainText;
          snapshot.bottomText = cur.bottomText;
          snapshot.hadReady = cursorEl.classList.contains('ready');
          snapshot.hadInverted = cursorEl.classList.contains('inverted');
          snapshot.captured = true;

          writeCursorTexts({
            topCn: '点击', topEn: 'click',
            mainText: '收集', bottomText: 'collect',
          });
          cursorEl.classList.add('ready');
          cursorEl.classList.add('inverted');
        });

        document.addEventListener('pointerout', (e) => {
          // 仅在确实从某个 collectable 容器移出（且不是移入其内部子元素）时才还原
          const fromTarget = e.target instanceof Element
            ? e.target.closest('.icon-container.collectable')
            : null;
          if (!fromTarget) return;
          // 被豁免的容器（如 sunflower 的 sun 收集）从未触发过 pointerover 处理，这里也直接跳过
          if (fromTarget.classList.contains('no-cursor-hover-effect')) return;
          const toEl = e.relatedTarget instanceof Element ? e.relatedTarget : null;
          if (toEl && toEl.closest && toEl.closest('.icon-container.collectable') === fromTarget) return;

          if (!snapshot.captured) return;
          writeCursorTexts({
            topCn: snapshot.topCn,
            topEn: snapshot.topEn,
            mainText: snapshot.mainText,
            bottomText: snapshot.bottomText,
          });
          if (!snapshot.hadReady) cursorEl.classList.remove('ready');
          if (!snapshot.hadInverted) cursorEl.classList.remove('inverted');
          snapshot.captured = false;
        });
      })();

      // 点击屏幕逻辑：分三段 —— 展开 → 汇聚 → 进入页面
      document.addEventListener('click', () => {
        if (!isLoadingReady) return; // 还没到5秒不能点

          // 第一阶段：点击“开始”，展开5个图标

                  { offset: 0.85, top: `${endY - 28}px`, transform: 'translate(-50%, -50%) rotate(630deg) scale(1)' },

                  { top: `${endY - 6}px`, transform: 'translate(-50%, -50%) rotate(0deg) scale(1)' }
                ], { duration: fallDuration, easing: 'linear', fill: 'forwards' });

                shadow.animate([
                  { opacity: 0, transform: 'translate(-50%, -50%) scale(0.4)' },
                  { offset: 0.7, opacity: 1, transform: 'translate(-50%, -50%) scale(1)' },
                  { offset: 0.85, opacity: 1, transform: 'translate(-50%, -50%) scale(0.9)' },
                  { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' }
                ], { duration: fallDuration, easing: 'linear', fill: 'forwards' });

                // 确保动画结束后可以被外部 CSS 的 transition 覆盖
                shadow.style.opacity = '1';
                
                // 播放背景循环音效
                const audioBase = document.getElementById('audio-base');

                // 种子开始下落的同时，立即开始播放序列帧动画
                playSunflowerSequence(endX, endY, seed, shadow);

                // 监听种子下落完成事件（仅作日志或保留结构用，不再触发动画）
                seedAnim.onfinish = () => {
                  // 下落已完成，清理动画产生的行内样式锁定，以便后续能通过 CSS transition 控制 opacity
                  seed.style.opacity = '1';
                  shadow.style.opacity = '1';
                };
              } catch (e) {
                // 忽略动画失败，保持静态展示
                console.error(e);
              }
            }, 450);
          }, 700); // 展开后停顿时间
        } else if (loadingPage.classList.contains('collapse')) {
          // 第三阶段：如果用户在这个阶段（包括后续的序列帧阶段）点击了背景，不再跳转下一个页面

        }

      // 播放向日葵序列帧动画 (Sow 发芽阶段)
      function playSunflowerSequence(x, y, seedElement, shadowElement) {
        // 播放 sow 阶段专属音效
        const audioSow = document.getElementById('audio-sow');
        if (audioSow) {
            audioSow.currentTime = 0;
            audioSow.play().catch(e => console.log('Audio play prevented:', e));
        }

        const seqContainer = document.createElement('div');
        seqContainer.id = 'sunflower-sequence';
        // 适应屏幕大小，覆盖整个窗口
        seqContainer.style.position = 'fixed';
        seqContainer.style.left = '0';
        seqContainer.style.top = '0';
        seqContainer.style.width = '100vw'; 
        seqContainer.style.height = '100vh';
        seqContainer.style.height = '100dvh';
        seqContainer.style.zIndex = '1000000';
        seqContainer.style.pointerEvents = 'none';
        
        // 如果 jpg 是白底，可以使用 mix-blend-mode 去除白底融入背景（可选）
        seqContainer.style.mixBlendMode = 'multiply';
        
        // 初始透明度为 0，添加平滑的淡入过渡效果
        seqContainer.style.opacity = '0';
        seqContainer.style.transition = 'opacity 1.5s ease-in-out';

        const img = document.createElement('img');
        img.style.width = '100%';
        img.style.height = '100%';
        // 使用 cover 保证图片比例，同时尽可能填满容器
        img.style.objectFit = 'cover';
        // 为了让视觉中心（比如发芽的底部）对齐之前的落点，可以将图片的对齐方式调整为底部居中
        img.style.objectPosition = 'center bottom';
        // 使用 will-change 提示浏览器对该层使用合成层，避免重复光栅化
        img.style.willChange = 'opacity, transform';
        
        // 预加载第一张 grow 的图片，防止 sow 切 grow 时闪白
        const preloadGrowImg = new Image();
        preloadGrowImg.decoding = 'async';
        preloadGrowImg.src = 'sunflower-assets/sunflower_grow/sunflower_grow_00000.jpg';

        // 提前在后台静默预加载 idle 的中间帧，因为现在更新为了241张 (0-240)，中间帧大约是120
        const preloadIdleImgMidEarly = new Image();
        preloadIdleImgMidEarly.decoding = 'async';
        preloadIdleImgMidEarly.src = 'sunflower-assets/sunflower_idle/sunflower_idle_00120.jpg';

        seqContainer.appendChild(img);
        document.getElementById('loading-page').appendChild(seqContainer);

        // ============ 优化：把帧动画改成基于 rAF 的时间驱动，并且用对象池缓存所有帧的 Image 对象 ============
        // sow 序列帧总数事先未知，使用容错探测；这里我们用持有的 Image 对象集中加载，避免每帧 new Image+onload 两次拉取
        const sowCache = {}; // key: frameIndex, value: HTMLImageElement
        let sowMaxKnown = -1; // 已经成功加载的最大帧索引（连续）
        let sowEnded = false;
        const sowLoadAhead = 30; // 一次最多并行预加载多少帧（避免一次发起几百个请求堵塞）

        function ensureSowFramesLoadedUpTo(targetIdx) {
          // 并行加载到 targetIdx + sowLoadAhead 之间还没加载的帧
          const upper = targetIdx + sowLoadAhead;
          for (let i = 0; i <= upper; i++) {
            if (sowCache[i] !== undefined) continue;
            const frameStr = i.toString().padStart(5, '0');
            const src = `sunflower-assets/sunflower_sow/sunflower_sow_${frameStr}.jpg`;
            const im = new Image();
            im.decoding = 'async';
            im.__loaded = false;
            im.__failed = false;
            im.onload = () => { im.__loaded = true; };
            im.onerror = () => { im.__failed = true; };
            im.src = src;
            sowCache[i] = im;
          }
        }
        ensureSowFramesLoadedUpTo(0);

        let currentFrame = 0;
        let consecutiveMissing = 0;
        const maxConsecutiveMissing = 3; // 连续多少帧加载失败认为序列结束
        const fps = 60; // 播放帧率，调整为 60帧/秒
        const frameDuration = 1000 / fps;
        let sowStartTs = 0;
        let lastIdlePingAt = 0;
        let firstFrameShown = false;

        function sowTick(now) {
          if (!sowStartTs) sowStartTs = now;
          if (now - lastIdlePingAt >= 1000) {
            recordUserActivity();
            lastIdlePingAt = now;
          }
          // 计算当前应当处于的帧
          const targetFrame = Math.floor((now - sowStartTs) / frameDuration);
          if (targetFrame > currentFrame) {
            currentFrame = targetFrame;
            ensureSowFramesLoadedUpTo(currentFrame);
          }
          const im = sowCache[currentFrame];
          if (im && im.__loaded) {
            // 避免重复设置同一 src（浏览器仍会触发 layout/paint）
            if (img.src !== im.src) img.src = im.src;
            consecutiveMissing = 0;
            if (!firstFrameShown) {
              firstFrameShown = true;
              requestAnimationFrame(() => { seqContainer.style.opacity = '1'; });
            }
          } else if (im && im.__failed) {
            consecutiveMissing++;
            if (consecutiveMissing >= maxConsecutiveMissing) {
              sowEnded = true;
            }
          }
          if (sowEnded) {
            console.log('向日葵 sow 序列帧播放完毕，共播放帧数：', currentFrame - consecutiveMissing);
            playSunflowerGrowSequence(seqContainer, img, seedElement, shadowElement);
            return;
          }
          requestAnimationFrame(sowTick);
        }
        requestAnimationFrame(sowTick);
      }

      // 播放第二阶段：向日葵生长序列帧动画
      function playSunflowerGrowSequence(seqContainer, imgElement, seedElement, shadowElement) {
        const fps = 60; // 保持 60帧/秒
        const frameDuration = 1000 / fps;
        let lastIdlePingAt = 0;
        
        console.log('开始播放向日葵 grow 序列帧...');
        
        // 播放 grow 阶段专属音效
        const audioGrow = document.getElementById('audio-grow');
        if (audioGrow) {
            audioGrow.currentTime = 0;
            audioGrow.play().catch(e => console.log('Audio play prevented:', e));
        }

        // 在 grow 阶段开始时，让种子和阴影缓慢淡出（比如耗时 2 秒）
        if (seedElement) {
            seedElement.style.transition = 'opacity 2s ease-in-out';
            seedElement.style.opacity = '0';
        }
        if (shadowElement) {
            // 需要强制取消之前的 animation 遗留状态，否则 opacity: 0 会被 forwards 阻挡
            const currentAnims = shadowElement.getAnimations();
            currentAnims.forEach(anim => anim.cancel());
            
            shadowElement.style.transition = 'opacity 2s ease-in-out';
            shadowElement.style.opacity = '0';
        }

        // 提前在后台静默预加载 idle 的中间帧（或第一帧），防止 grow 切 idle 时的瞬间空白
        // 因为 idle 会优先取中间帧作为第一张渲染 (总共 241 张，中间是 120)
        const preloadIdleImg = new Image();
        preloadIdleImg.decoding = 'async';
        preloadIdleImg.src = 'sunflower-assets/sunflower_idle/sunflower_idle_00000.jpg';
        const preloadIdleImgMid = new Image();
        preloadIdleImgMid.decoding = 'async';
        preloadIdleImgMid.src = 'sunflower-assets/sunflower_idle/sunflower_idle_00120.jpg';

        // ============ 优化：grow 帧改成对象池 + rAF 时间驱动 ============
        const growCache = {};
        const growLoadAhead = 30;
        function ensureGrowFramesLoadedUpTo(targetIdx) {
          const upper = targetIdx + growLoadAhead;
          for (let i = 0; i <= upper; i++) {
            if (growCache[i] !== undefined) continue;
            const frameStr = i.toString().padStart(5, '0');
            const src = `sunflower-assets/sunflower_grow/sunflower_grow_${frameStr}.jpg`;
            const im = new Image();
            im.decoding = 'async';
            im.__loaded = false;
            im.__failed = false;
            im.onload = () => { im.__loaded = true; };
            im.onerror = () => { im.__failed = true; };
            im.src = src;
            growCache[i] = im;
          }
        }
        ensureGrowFramesLoadedUpTo(0);

        let currentFrame = 0;
        let consecutiveMissing = 0;
        const maxConsecutiveMissing = 3;
        let growStartTs = 0;
        let growEnded = false;

        function growTick(now) {
          if (!growStartTs) growStartTs = now;
          if (now - lastIdlePingAt >= 1000) {
            recordUserActivity();
            lastIdlePingAt = now;
          }
          const targetFrame = Math.floor((now - growStartTs) / frameDuration);
          if (targetFrame > currentFrame) {
            currentFrame = targetFrame;
            ensureGrowFramesLoadedUpTo(currentFrame);
          }
          const im = growCache[currentFrame];
          if (im && im.__loaded) {
            if (imgElement.src !== im.src) imgElement.src = im.src;
            consecutiveMissing = 0;
          } else if (im && im.__failed) {
            consecutiveMissing++;
            if (consecutiveMissing >= maxConsecutiveMissing) {
              growEnded = true;
            }
          }
          if (growEnded) {
            console.log('向日葵 grow 序列帧播放完毕，共播放帧数：', currentFrame - consecutiveMissing);
              
            // 为了平滑过渡，我们在上面叠加一个新的 img 用于播放 idle 阶段
            // 让旧的 grow 停在最后一帧，然后新的 idle 图片从透明度 0 渐变到 1
            const idleImg = document.createElement('img');
            idleImg.style.width = '100%';
            idleImg.style.height = '100%';
            idleImg.style.objectFit = 'cover';
            idleImg.style.objectPosition = 'center bottom';
            idleImg.style.position = 'absolute';
            idleImg.style.top = '0';
            idleImg.style.left = '0';
            idleImg.style.opacity = '0';
            idleImg.style.transition = 'opacity 1.5s ease-in-out';
            idleImg.style.willChange = 'opacity';

            seqContainer.appendChild(idleImg);

            // 启动第三阶段：交互式 idle 序列帧，传入新的图片层
            playSunflowerIdleInteractive(seqContainer, idleImg, imgElement);
            return;
          }
          requestAnimationFrame(growTick);
        }
        requestAnimationFrame(growTick);
      }

      // 播放第三阶段：鼠标交互式 idle 序列帧
      function playSunflowerIdleInteractive(seqContainer, idleImgElement, oldGrowImgElement) {
        console.log('进入交互式 idle 阶段...');
        
        // 开始播放 idle 阶段循环音效
        const audioIdle = document.getElementById('audio-idle');
        if (audioIdle) {
            audioIdle.play().catch(e => console.log('Audio play prevented:', e));
        }

        let totalIdleFrames = 0;
        const maxIdleSearch = 300; 

        let currentTargetFrameIndex = 0;
        let currentDisplayedFrameIndex = 0;
        let highestLoadedFrame = 0;
        const imageCache = {}; // 缓存已加载的图片
        
        let isFirstIdleFrameRendered = false;

        // ============ 优化：并行预加载所有 idle 帧 ============
        // 原代码用串行递归预加载（一张完成再加下一张）速度慢、长时间无可用帧
        // 现在并行发起所有请求，浏览器会自动合理分配并发数
        const idleParallelMax = 241; // 我们已知 idle 有约 241 张（0-240），可以全部一次性发起
        let idleProbeFinished = false;
        for (let i = 0; i < idleParallelMax; i++) {
          const frameStr = i.toString().padStart(5, '0');
          const src = `sunflower-assets/sunflower_idle/sunflower_idle_${frameStr}.jpg`;
          const tempImg = new Image();
          tempImg.decoding = 'async';
          (function(idx, source){
            tempImg.onload = () => {
              imageCache[idx] = source;
              if (idx > highestLoadedFrame) highestLoadedFrame = idx;
              totalIdleFrames = highestLoadedFrame + 1;
            };
            tempImg.onerror = () => {
              // 找到了序列末尾时记录
              if (!idleProbeFinished && idx <= highestLoadedFrame + 1) {
                idleProbeFinished = true;
                totalIdleFrames = highestLoadedFrame + 1;
                console.log('Idle序列帧加载完成，总帧数：', totalIdleFrames);
              }
            };
          })(i, src);
          tempImg.src = src;
        }

        // ============ 优化：mousemove 节流 + passive ============
        let mousePercentage = 0.5; // 默认停在中间
        let __pendingMouseX = -1;
        const onMouseMove = (e) => {
            if (totalIdleFrames <= 0) return;
            // 不再每次都计算和重赋值变量，留待 rAF 中处理
            __pendingMouseX = e.clientX;
        };
        window.addEventListener('mousemove', onMouseMove, { passive: true });

        let time = 0;

        // 使用 requestAnimationFrame 和 lerp 进行平滑过渡
        function renderInteractiveFrame() {
            // 在 rAF 内集中读 pendingMouseX，最多一次
            if (__pendingMouseX >= 0) {
                mousePercentage = Math.max(0, Math.min(1, __pendingMouseX / window.innerWidth));
                __pendingMouseX = -1;
            }

            if (totalIdleFrames > 0) {
                // 如果这是第一次真正准备渲染，并且第一帧图片（我们希望从中间开始）已经加载好
                // 强制将初始值设为中间，避免从 0 飞速滑到 0.5
                if (!isFirstIdleFrameRendered) {
                    currentDisplayedFrameIndex = 0.5 * (totalIdleFrames - 1);
                }

                time += 0.02; // 控制呼吸频率的速度
                const breathingOffset = Math.sin(time) * 0.015;

                let targetPercentage = mousePercentage + breathingOffset;
                if (targetPercentage < 0) targetPercentage = 0;
                else if (targetPercentage > 1) targetPercentage = 1;

                // 如果全局标志 __forceIdleCenter 被激活，则无视鼠标和呼吸，强制目标为 0.5
                if (window.__forceIdleCenter) {
                    targetPercentage = 0.5;
                }

                currentTargetFrameIndex = targetPercentage * (totalIdleFrames - 1);

                currentDisplayedFrameIndex += (currentTargetFrameIndex - currentDisplayedFrameIndex) * 0.05;
                
                const frameToShow = Math.round(currentDisplayedFrameIndex);
                const clampedFrame = frameToShow < 0 ? 0 : (frameToShow > highestLoadedFrame ? highestLoadedFrame : frameToShow);
                
                const targetSrc = imageCache[clampedFrame];
                if (targetSrc) {
                    // 关键性能点：只有 src 真的不同才赋值，避免无效的 DOM 写入和 paint
                    if (idleImgElement.__lastSrc !== targetSrc) {
                        idleImgElement.src = targetSrc;
                        idleImgElement.__lastSrc = targetSrc;
                        
                        // 当第一张 idle 图片成功赋上并且渲染后，触发渐变淡入
                        if (!isFirstIdleFrameRendered) {
                            isFirstIdleFrameRendered = true;
                            requestAnimationFrame(() => {
                                idleImgElement.style.opacity = '1';
                                // 等淡入完成后，可以选择隐藏/移除旧的 grow 图片以节省内存
                                setTimeout(() => {
                                    if (oldGrowImgElement && oldGrowImgElement.parentNode) {
                                        oldGrowImgElement.remove();
                                    }
                                }, 1500); // 配合 1.5s 的 transition
                            });
                        }
                    }
                }
            }
            
            requestAnimationFrame(renderInteractiveFrame);
        }

        renderInteractiveFrame();
        
        // 启动第四阶段：长按交互的 glow 序列帧
        setupGlowInteraction(seqContainer, idleImgElement);
      }

      // 播放第四阶段：长按交互的 glow 序列帧
      function setupGlowInteraction(seqContainer, idleImgElement) {
        // 创建用于播放 glow 的图片层
        const glowImgElement = document.createElement('img');
        glowImgElement.style.width = '100%';
        glowImgElement.style.height = '100%';
        glowImgElement.style.objectFit = 'cover';
        glowImgElement.style.objectPosition = 'center bottom';
        glowImgElement.style.position = 'absolute';
        glowImgElement.style.top = '0';
        glowImgElement.style.left = '0';
        glowImgElement.style.opacity = '0'; // 初始隐藏
        glowImgElement.style.transition = 'opacity 0.1s ease-in-out'; // 缩短初始渐变时间
        glowImgElement.style.pointerEvents = 'none';
        
        // 预加载并提前赋上第一张图，防止首次点击时因 src 为空而闪白
        glowImgElement.src = 'sunflower-assets/sunflower_glow/sunflower_glow_00000.jpg';
        
        seqContainer.appendChild(glowImgElement);

        // ============ 优化：预加载 glow 序列帧改为并行 ============
        let totalGlowFrames = 0;
        let highestGlowFrame = 0;
        const glowCache = {};
        let glowProbeFinished = false;
        const glowParallelMax = 400; // 上限足够大，实际帧数以“从 0 起连续存在的最大 idx”为准
        let glowProbeCompletedCount = 0; // 跟踪 onload/onerror 完成总数，防止 race
        const finalizeGlowProbe = () => {
            if (glowProbeFinished) return;
            if (glowProbeCompletedCount < glowParallelMax) return;
            // 所有探测请求都已返回，根据 glowCache 从 0 开始寻找最大连续帧
            let cont = -1;
            for (let k = 0; k < glowParallelMax; k++) {
                if (glowCache[k]) cont = k; else break;
            }
            if (cont < 0) return; // 全都加载失败，不设完成
            highestGlowFrame = cont;
            totalGlowFrames = highestGlowFrame + 1;
            glowProbeFinished = true;
            console.log('Glow序列帧预加载完成，总帧数：', totalGlowFrames);
        };
        for (let i = 0; i < glowParallelMax; i++) {
          const frameStr = i.toString().padStart(5, '0');
          const src = `sunflower-assets/sunflower_glow/sunflower_glow_${frameStr}.jpg`;
          const tempImg = new Image();
          tempImg.decoding = 'async';
          (function(idx, source){
            tempImg.onload = () => {
              glowCache[idx] = source;
              glowProbeCompletedCount++;
              finalizeGlowProbe();
            };
            tempImg.onerror = () => {
              glowProbeCompletedCount++;
              finalizeGlowProbe();
            };
          })(i, src);
          tempImg.src = src;
        }

        // 创建指定的交互区域（定位在屏幕的右上区域）
        const hitArea = document.createElement('div');
        hitArea.id = 'glow-hit-area';
        hitArea.style.position = 'fixed';
        // 改为右上角定位
        hitArea.style.right = '5%';  // 距离右边 5%
        hitArea.style.top = '20%';   // 距离顶边 20%
        // hitArea.style.transform = 'translateX(-50%)'; // 删掉居中用的 transform
        hitArea.style.width = '300px'; // 可以根据右上角的视觉元素大小调整宽度
        hitArea.style.height = '300px'; // 高度
        hitArea.style.zIndex = '1000001'; // 确保在最上层可点击
        hitArea.style.cursor = 'pointer';
        
        // 呼吸圆环（3秒后显示）
        const hintSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        hintSvg.style.position = 'absolute';
        hintSvg.style.top = '50%';
        hintSvg.style.left = '50%';
        hintSvg.style.transform = 'translate(-50%, -50%)';
        hintSvg.style.width = '120px';
        hintSvg.style.height = '120px';
        hintSvg.style.pointerEvents = 'none';
        hintSvg.style.opacity = '0';
        hintSvg.style.transition = 'opacity 0.5s ease-in-out';
        
        let hintPulseActive = false;
        const pulseSpeed = 0.003;
        const baseRadius = 18; 
        const whiteLineWidth = 3.5;
        const blackStrokeWidth = 0.75;

        // === 聚光灯遮罩：全屏径向渐厸，中心镂空，周围压暗 ===
        // hitArea 位于 right:5% top:20%、尺寸 300x300，因此圆环中心在视口坐标：
        //   x = 100% - 5% - 150px（即 calc(95% - 150px)）
        //   y = 20% + 150px
        const hintMask = document.createElement('div');
        hintMask.style.position = 'fixed';
        hintMask.style.left = '0';
        hintMask.style.top = '0';
        hintMask.style.width = '100vw';
        hintMask.style.height = '100vh';
        hintMask.style.pointerEvents = 'none';
        hintMask.style.opacity = '0';
        hintMask.style.transition = 'opacity 0.6s ease-in-out';
        // 位于 hitArea (zIndex=1000001) 之下，但高于页面主体，这样圆环依然超在遮罩之上
        hintMask.style.zIndex = '1000000';
        // 径向渐变：中心透明（~baseRadius*1.6 = 30px）→ 边缘半透明黑色
        // 注：暗度由 updateHintCircle 每帧动态更新以呈现呼吸感，这里仅给一个初始静态值避免首帧空白
        const hintMaskCx = 'calc(95% - 150px)';
        const hintMaskCy = 'calc(20% + 150px)';
        // 与 canvas 模块一致的呼吸峰值暗度。注：canvas 版本最暗点在画布最远角，
        // 这里让停点拉到视口边缘附近，表现其他章节类似的柔和过渡
        const hintMaskPeakDark = 0.5;
        const buildHintMaskBg = (darkAlpha) => (
            `radial-gradient(circle at ${hintMaskCx} ${hintMaskCy}, ` +
            `rgba(0,0,0,0) 30px, ` +
            `rgba(0,0,0,${(darkAlpha * 0.18).toFixed(3)}) 180px, ` +
            `rgba(0,0,0,${(darkAlpha * 0.55).toFixed(3)}) 480px, ` +
            `rgba(0,0,0,${darkAlpha.toFixed(3)}) 900px)`
        );
        hintMask.style.background = buildHintMaskBg(hintMaskPeakDark);
        document.body.appendChild(hintMask);
        
        const hintWhiteCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hintWhiteCircle.setAttribute('cx', '60');
        hintWhiteCircle.setAttribute('cy', '60');
        hintWhiteCircle.setAttribute('fill', 'none');
        hintWhiteCircle.setAttribute('stroke-width', whiteLineWidth.toString());
        
        const hintBlackCircle1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hintBlackCircle1.setAttribute('cx', '60');
        hintBlackCircle1.setAttribute('cy', '60');
        hintBlackCircle1.setAttribute('fill', 'none');
        hintBlackCircle1.setAttribute('stroke-width', blackStrokeWidth.toString());
        
        const hintBlackCircle2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hintBlackCircle2.setAttribute('cx', '60');
        hintBlackCircle2.setAttribute('cy', '60');
        hintBlackCircle2.setAttribute('fill', 'none');
        hintBlackCircle2.setAttribute('stroke-width', blackStrokeWidth.toString());
        
        hintSvg.appendChild(hintWhiteCircle);
        hintSvg.appendChild(hintBlackCircle1);
        hintSvg.appendChild(hintBlackCircle2);
        hitArea.appendChild(hintSvg);
        
        const updateHintCircle = (timestamp) => {
            if (!hintPulseActive) return;
            
            const sinVal = Math.sin(timestamp * pulseSpeed);
            const scale = 1 + sinVal * 0.3; 
            const currentRadius = baseRadius * scale;
            const alpha = 0.5 + sinVal * 0.3; 
            
            // 聚光灯遮罩呼吸：暗度区间 0.7~1.0，与各 canvas 模块的 drawHintSpotlight 节奏一致
            const maskBreath = 0.85 + sinVal * 0.15;
            hintMask.style.background = buildHintMaskBg(hintMaskPeakDark * maskBreath);
            
            hintWhiteCircle.setAttribute('r', currentRadius.toString());
            hintWhiteCircle.setAttribute('stroke', `rgba(255, 255, 255, ${alpha})`);
            
            hintBlackCircle1.setAttribute('r', (currentRadius + whiteLineWidth / 2).toString());
            hintBlackCircle1.setAttribute('stroke', `rgba(0, 0, 0, ${alpha})`);
            
            hintBlackCircle2.setAttribute('r', (currentRadius - whiteLineWidth / 2).toString());
            hintBlackCircle2.setAttribute('stroke', `rgba(0, 0, 0, ${alpha})`);
            
            requestAnimationFrame(updateHintCircle);
        };

        const hintAudio = document.getElementById('audio-sunflower-hint');
        let hintTimer = null;
        let isPointerOverHitArea = false;

        function setCustomCursorText({ topCn, topEn, mainText, bottomText }) {
            const cursor = document.getElementById('custom-cursor');
            if (!cursor) return;

            const cnTop = cursor.querySelector('#cursor-text-top-cn');
            const enTop = cursor.querySelector('#cursor-text-top-en');
            const main = cursor.querySelector('#cursor-text-main');
            const bottom = cursor.querySelector('#cursor-text-bottom');

      // 封装切换动画的通用逻辑
      function setupToggleAnimation(toggleBtnId) {
        const toggleBtn = document.getElementById(toggleBtnId);
        let isAnimating = false;
  
        toggleBtn.addEventListener('click', () => {
          if (isAnimating) return;
          isAnimating = true;
  
          // 只获取当前被点击容器内的彩虹层
          const rainbows = toggleBtn.querySelectorAll('.rainbow-fill');
          rainbows.forEach(r => r.style.opacity = '1');
  
          setTimeout(() => {
            toggleBtn.classList.toggle('active');
            
            if (toggleBtn.classList.contains('active')) {
              toggleBtn.classList.add('glowing');
            }
  
            setTimeout(() => {
              rainbows.forEach(r => r.style.opacity = '0');
              
              setTimeout(() => {
                toggleBtn.classList.remove('glowing');
              }, 300);
  
              setTimeout(() => {
                isAnimating = false;
              }, 1200);
            }, 800);
          }, 100);
        });
      }

      // 为五个图标容器分别绑定点击动画
      setupToggleAnimation('sun-toggle');

      setupToggleAnimation('taste-toggle');

      // -------------------------------------
      // 新增：平滑的自定义光标跟随及点击动效
      // -------------------------------------
      const customCursor = document.getElementById('custom-cursor');
      
      // 优化：mousemove 监听只记录位置，实际写入 DOM 在 rAF 中节流，避免每次 mousemove 都触发布局
      // 同时使用 passive 监听，避免阻塞滚动等
      let __cursorX = 0, __cursorY = 0, __cursorPending = false;
      function __cursorRender() {
        __cursorPending = false;
        // 仍然使用 left/top（因为 cursor 的 transform 已经被 scale 等用了），但合并到一次 rAF 写入
        customCursor.style.left = __cursorX + 'px';
        customCursor.style.top = __cursorY + 'px';
      }
      
      document.addEventListener('mousemove', function(e) {
        __cursorX = e.clientX;
        __cursorY = e.clientY;
        if (!__cursorPending) {
          __cursorPending = true;
          requestAnimationFrame(__cursorRender);
        }
      }, { passive: true });

      document.addEventListener('mousedown', function(e) {
        // 1. 触发平滑缩放动效
        customCursor.classList.add('clicked');

        // 2. 触发水波纹动效
        const ripple = document.createElement('div');
        ripple.className = 'cursor-click-effect';
        // 将动效圆心设置在鼠标点击的坐标上
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);

        // 动画结束后（500ms）移除元素，避免DOM堆积
        setTimeout(() => {
          ripple.remove();
        }, 500);
      });

      // 鼠标松开时恢复光标大小
      document.addEventListener('mouseup', function() {
        customCursor.classList.remove('clicked');
      });

      // 鼠标移出/移入窗口时隐藏/显示自定义光标
      document.addEventListener('mouseleave', () => customCursor.style.display = 'none');
      document.addEventListener('mouseenter', () => customCursor.style.display = 'block');
    </script>
